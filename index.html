<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Noteboard" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Noteboard</title>
    <script>
      // Light / dark choice (Settings in the app), applied before anything is drawn.
      try {
        var t = localStorage.getItem('noteboard.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      /* Launch screen: a plain background in the app's colour (no logo, so the sidebar logo is the
         only one ever seen). Removed as soon as the app has drawn its first screen (src/main.tsx). */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #ffffff;
        transition: opacity 0.2s ease;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #splash { background: #141a21; }
      }
      :root[data-theme='dark'] #splash { background: #141a21; }
      #splash.hide { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
