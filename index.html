<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Noteboard" />
    <meta name="theme-color" content="#f4f4f7" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Noteboard</title>
    <script>
      // Light / dark choice (Settings in the app), applied before anything is drawn.
      try {
        var t = localStorage.getItem('noteboard.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      /* Launch screen: shown until the app has drawn its first screen (see src/main.tsx). */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #f4f4f7;
        transition: opacity 0.35s ease;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #splash { background: #0b0b0d; }
        :root:not([data-theme='light']) #splash .splash-name { color: #f2f2f7; }
      }
      :root[data-theme='dark'] #splash { background: #0b0b0d; }
      :root[data-theme='dark'] #splash .splash-name { color: #f2f2f7; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .splash-inner { display: grid; justify-items: center; gap: 18px; animation: splash-in 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.15); }
      #splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgba(76, 90, 245, 0.35); }
      #splash .splash-name { font: 600 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; letter-spacing: -0.01em; color: #1c1c1e; }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.92); } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <img src="/icon.svg" alt="" />
        <div class="splash-name">Noteboard</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
