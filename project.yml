name: Noteboard
options:
  bundleIdPrefix: com.noteboard
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "2"          # iPad only
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  NoteboardKit:
    path: Packages/NoteboardKit

targets:
  Noteboard:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: NoteboardKit
        product: NoteboardCore
      - package: NoteboardKit
        product: NoteboardLibrary
      - package: NoteboardKit
        product: NoteboardCanvas
      - package: NoteboardKit
        product: NoteboardPDF
      - package: NoteboardKit
        product: NoteboardSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noteboard.app
        INFOPLIST_KEY_CFBundleDisplayName: Noteboard
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: App/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Noteboard Notebook
            LSHandlerRank: Owner
            LSItemContentTypes: [com.noteboard.notebook]
          - CFBundleTypeName: PDF
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.noteboard.notebook
            UTTypeDescription: Noteboard Notebook
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [noteboard]

  NoteboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Noteboard

schemes:
  Noteboard:
    build:
      targets:
        Noteboard: all
    test:
      targets:
        - NoteboardUITests
        - package: NoteboardKit/NoteboardCoreTests
        - package: NoteboardKit/NoteboardLibraryTests
