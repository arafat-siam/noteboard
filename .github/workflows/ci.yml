name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Package unit tests
        working-directory: Packages/NoteboardKit
        run: swift test
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build app for iPad simulator
        run: |
          xcodebuild build \
            -project Noteboard.xcodeproj \
            -scheme Noteboard \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
