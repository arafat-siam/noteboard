name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, so the redesign branch can be built as the design preview below.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Each check runs even if an earlier one failed, so one run reports every error.
      # Errors are re-emitted as annotations, which are readable without signing in to GitHub.
      - name: Type check
        if: success() || failure()
        run: bash scripts/ci-run.sh "Type check" npx tsc --noEmit
      - name: Unit tests
        if: success() || failure()
        run: bash scripts/ci-run.sh "Unit tests" npx vitest run
      - name: Build
        if: success() || failure()
        run: bash scripts/ci-run.sh "Build" npx vite build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}

      # Design preview: the redesign branch (if there is one) at https://arafat-siam.github.io/noteboard/preview/
      # It's rebuilt whenever main is published. It shares the app's notes on the device, so it
      # must not change how notes are stored.
      - name: Build design preview
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if git rev-parse --verify --quiet origin/redesign >/dev/null; then
            git worktree add ../redesign origin/redesign
            cd ../redesign && npm ci
            NOTEBOARD_BASE=/noteboard/preview/ bash scripts/ci-run.sh "Preview build" npx vite build --outDir "$GITHUB_WORKSPACE/dist/preview" --emptyOutDir
          else
            echo "No redesign branch, so no preview."
          fi
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}

      # The Noteboard Shell app, downloadable at https://arafat-siam.github.io/noteboard/NoteboardShell.swiftpm.zip
      - name: Package shell app
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: cd wrapper && zip -qr ../dist/NoteboardShell.swiftpm.zip NoteboardShell.swiftpm

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    # Publishes the app to https://arafat-siam.github.io/noteboard/
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
